name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Lint, Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      # Reihenfolge mit Absicht: Compilerfehler sind das wertvolle Signal,
      # Formatierung ist trivial zu beheben. Liefe fmt zuerst, verdeckte ein
      # verrutschter Zeilenumbruch jeden echten Fehler.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo fmt --all --check

  audit:
    name: Abhaengigkeits-Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-audit installieren
        run: cargo install cargo-audit --locked

      # Bewusst nur echte Schwachstellen lassen den Job scheitern.
      # Die "unmaintained"-Hinweise stammen fast alle aus den GTK3-Bindings,
      # die Tauri nur fuer Linux mitschleppt und die im macOS-Build gar nicht
      # uebersetzt werden. Sie werden trotzdem ausgegeben, nur nicht als Fehler.
      - name: cargo audit
        run: |
          cargo audit --json --file Cargo.lock > audit.json || true
          python3 - <<'PY'
          import json, sys
          report = json.load(open("audit.json"))
          vulns = report["vulnerabilities"]
          print(f"Schwachstellen: {vulns['count']}")
          for entry in vulns["list"]:
              adv = entry["advisory"]
              print(f"  {adv['id']}  {adv['package']}  {adv['title']}")
          for kind, items in sorted(report.get("warnings", {}).items()):
              print(f"Hinweis ({kind}): {len(items)}")
              for item in items:
                  print(f"  {item['advisory']['id']}  {item['package']['name']}")
          sys.exit(1 if vulns["found"] else 0)
          PY

  build:
    name: DMG bauen
    needs: check
    runs-on: macos-14
    env:
      # Nur als Schalter fuer `if:`. Die echten APPLE_*-Namen duerfen hier
      # NICHT stehen: fehlt ein Secret, definiert GitHub die Variable
      # trotzdem - als leeren String. Tauris Bundler prueft aber nur, ob sie
      # vorhanden ist, und laeuft dann in einen Keychain-Import ohne Zertifikat.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain (universal2)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: tauri-cli installieren
        run: cargo install tauri-cli --version "^2" --locked

      - name: Signaturstatus
        run: |
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            echo "Apple-Zertifikat vorhanden - DMG wird signiert."
          else
            echo "Kein APPLE_CERTIFICATE-Secret - DMG wird ad-hoc signiert."
            echo "Beim ersten Start meldet macOS dann 'nicht verifizierter Entwickler'."
          fi

      # Den Keychain-Import macht der Tauri-Bundler selbst, sobald
      # APPLE_CERTIFICATE und APPLE_CERTIFICATE_PASSWORD gesetzt sind.
      - name: Build (universal DMG)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Leer gebliebene Signier-Variablen entfernen, siehe Kommentar oben.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                     APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then unset "$var"; fi
          done
          cargo tauri build --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: Fero-macOS-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Release anhaengen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
